<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Spheres -->
  <circle cx="150" cy="100" r="160" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="280" r="180" fill="#818cf8" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Status Pill -->
  <g transform="translate(80, 55)">
    <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#10b981"/>
    <text x="34" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">
      HUAWEI R&amp;D TÜRKİYE · MOBILE DEVELOPER
    </text>
  </g>

  <!-- Name / Title -->
  <text x="80" y="150" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Ahmet Kadir <tspan fill="url(#accentGrad)">Çiçek</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Crafting high-performance mobile, wearable, and web applications.
  </text>

  <!-- Core Platforms / Stacks -->
  <g transform="translate(80, 245)">
    <!-- Pill 1: Wearables / HarmonyOS -->
    <rect width="220" height="40" rx="12" fill="#172033" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="22" cy="20" r="5" fill="#38bdf8"/>
    <text x="36" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">HarmonyOS · ArkTS</text>

    <!-- Pill 2: Flutter / Wasm -->
    <rect x="235" width="220" height="40" rx="12" fill="#172033" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="257" cy="20" r="5" fill="#60a5fa"/>
    <text x="271" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Flutter · Dart · Wasm</text>

    <!-- Pill 3: Native iOS / Swift -->
    <rect x="470" width="220" height="40" rx="12" fill="#172033" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="492" cy="20" r="5" fill="#a78bfa"/>
    <text x="506" y="25" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">iOS · Swift · SwiftUI</text>
  </g>

  <!-- Right Visual / Metric Accent -->
  <g transform="translate(860, 80)">
    <rect width="260" height="220" rx="16" fill="#0d1322" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="24" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SPECIALIZATIONS</text>
    
    <g transform="translate(24, 70)">
      <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
      <text x="22" y="12" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Smart Wearables Architecture</text>
    </g>

    <g transform="translate(24, 110)">
      <circle cx="8" cy="8" r="4" fill="#60a5fa"/>
      <text x="22" y="12" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Health Kit &amp; Wear Engine</text>
    </g>

    <g transform="translate(24, 150)">
      <circle cx="8" cy="8" r="4" fill="#818cf8"/>
      <text x="22" y="12" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Cross-Platform Engineering</text>
    </g>

    <g transform="translate(24, 190)">
      <circle cx="8" cy="8" r="4" fill="#a78bfa"/>
      <text x="22" y="12" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Native iOS &amp; SwiftData</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(80, 325)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">
      📍 Istanbul, Türkiye · 🌐 <tspan fill="#38bdf8" font-weight="600">ahmetkadircicek.com.tr</tspan>
    </text>
  </g>
</svg>
